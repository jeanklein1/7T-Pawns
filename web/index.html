<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>7T · gallery</title>
<style>
  /* Two-tier tokens — identical shape to harness.html; re-theme via palette tier only. */
  :root {
    /* palette tier — literal hues (from the oil) */
    --sand:      #EFE6D4;
    --bone:      #E1D3B6;
    --ink:       #211E1C;
    --ink-soft:  #5A554C;
    --sky:       #6E9BC0;
    --coral:     #DC987B;
    --gold:      #E0A24E;
    --olive:     #9DA177;
    --lavender:  #A29EAF;
    --orb-red:   #C0532F;   /* rationed punctuation */

    /* semantic tier — roles */
    --bg:     var(--ink);
    --fg:     var(--sand);
    --muted:  var(--ink-soft);
    --accent: var(--orb-red);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.02em; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  #status { position: fixed; left: 22px; top: 20px; z-index: 10; color: var(--muted);
    white-space: pre; pointer-events: none; max-height: 90vh; overflow: hidden; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="status">booting…</div>
  <script type="module" src="./js/boot.js"></script>
</body>
</html>
